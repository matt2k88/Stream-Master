plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ultracast.webview'
    compileSdk 34

    defaultConfig {
        applicationId "com.ultracast.webview"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Change this to your deployed production URL before building.
        // Build-time constant so Kotlin never needs to be touched.
        buildConfigField "String", "APP_URL", '"https://ultracast.replit.app"'
    }

    buildTypes {
        debug {
            // Debug builds can override the URL with a local dev server.
            // e.g. buildConfigField "String", "APP_URL", '"http://192.168.1.x:5000"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        // libvlc ships its own JNI libraries; avoid conflicts.
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libvlc.so'
    }
}

dependencies {
    // LibVLC — widest codec support (raw MPEG-TS, AC3, exotic containers).
    // "libvlc-all" includes all CPU architectures (arm64, x86, x86_64).
    implementation 'org.videolan.android:libvlc-all:3.6.0'

    // ExoPlayer (Media 3) — used for HLS and DASH streams.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
